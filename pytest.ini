[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    l2: Layer 2 switching validations
    l3: Layer 3 routing validations
    overlay: VXLAN/EVPN validations
    negative: negative and fault-injection tests
    recovery: recovery behavior tests
    real_device: opt-in read-only integration tests requiring an authorized lab device
